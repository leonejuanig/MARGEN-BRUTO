<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Margen Bruto · Terra Más</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#eee9df;--surface:#fff;--surface2:#f5f1ea;--border:#d9d3c6;
  --primary:#1a3020;--primary-light:#274830;--primary-muted:#3d6148;
  --accent:#c8a84b;--accent-light:#f5e9c0;
  --text:#1a1a1a;--text-muted:#6b6560;
  --positive:#1a6630;--negative:#b83030;--radius:8px;
}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px}

/* ── HEADER ── */
.header{background:var(--primary);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hbrand{display:flex;align-items:center;gap:14px}
.hbrand h1{font-family:'Playfair Display',serif;font-size:19px;font-weight:700}
.hbrand .sub{color:var(--accent);font-size:12px;font-family:'IBM Plex Mono',monospace}
.hactions{display:flex;gap:8px}
.btn-h{padding:6px 14px;border-radius:4px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);font-size:12px;cursor:pointer;transition:all .15s;font-family:'IBM Plex Sans',sans-serif}
.btn-h:hover{background:rgba(255,255,255,.16);color:#fff}
.btn-save{border-color:var(--accent);color:var(--accent)}.btn-save:hover{background:rgba(200,168,75,.15)}

/* ── TABS ── */
.tabs{background:var(--primary-light);display:flex;padding:0 20px;overflow-x:auto;position:sticky;top:54px;z-index:190;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 22px;cursor:pointer;color:rgba(255,255,255,.5);font-size:13px;font-weight:500;border-bottom:3px solid transparent;transition:all .18s;white-space:nowrap;letter-spacing:.02em;user-select:none}
.tab:hover{color:rgba(255,255,255,.85)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── LAYOUTS ── */
#content{min-height:calc(100vh - 98px)}
.crop-layout{display:grid;grid-template-columns:1fr 360px;min-height:calc(100vh - 98px)}
.ts-layout{display:grid;grid-template-columns:1fr 1fr 360px;min-height:calc(100vh - 98px)}

/* ── LEFT ── */
.left-panel{padding:20px 22px;overflow-y:auto}
.left-panel.narrow{padding:16px 16px}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-header{background:var(--primary);color:#fff;padding:9px 16px;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.card-total{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--accent);font-weight:500}
.card-body{padding:16px}.card-body.tight{padding:12px}

/* ── PARAMS ── */
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pf label{display:block;font-size:10.5px;color:var(--text-muted);margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.pf input{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:500;color:var(--text);background:var(--surface2);transition:border-color .15s,background .15s}
.pf input:focus{outline:none;border-color:var(--accent);background:#fff}

/* ── FLETE ── */
.flete-block{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-top:10px}
.flete-title{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--text-muted);margin-bottom:8px}
.flete-row{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;margin-bottom:7px}
.flete-row:last-child{margin-bottom:0}
.fl-name{font-size:11.5px;color:var(--text);font-weight:500}
.fl-result{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--primary-muted);white-space:nowrap}
.flete-row input{padding:5px 7px;border:1px solid var(--border);border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;background:#fff;color:var(--text);text-align:right;transition:border-color .15s;width:100%}
.flete-row input:focus{outline:none;border-color:var(--accent)}

/* ── TABLE ── */
.tbl-head{display:grid;gap:6px;padding:0 0 6px;margin-bottom:6px;border-bottom:1px solid var(--border)}
.tbl-head span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:600}
.tbl-head.ins{grid-template-columns:1fr 76px 68px 62px 26px}
.tbl-head.lab{grid-template-columns:1fr 52px 76px 62px 26px}
.etapa-group{margin-bottom:14px}
.etapa-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);padding:5px 0 6px;border-bottom:1px solid var(--accent-light);margin-bottom:7px}
.ins-row{display:grid;grid-template-columns:1fr 76px 68px 62px 26px;gap:6px;align-items:center;margin-bottom:4px}
.lab-row{display:grid;grid-template-columns:1fr 52px 76px 62px 26px;gap:6px;align-items:center;margin-bottom:4px}
.ins-row input,.lab-row input{padding:5px 7px;border:1px solid var(--border);border-radius:4px;font-size:13px;font-family:'IBM Plex Mono',monospace;background:var(--surface2);color:var(--text);transition:border-color .15s,background .15s;width:100%}
.ins-row input[type=text],.lab-row input[type=text]{font-family:'IBM Plex Sans',sans-serif}
.ins-row input:focus,.lab-row input:focus{outline:none;border-color:var(--accent);background:#fff}
.tcell{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;color:var(--primary);text-align:right;padding-right:2px}
.btn-del{width:24px;height:24px;border:none;background:none;cursor:pointer;color:#ccc;font-size:17px;border-radius:4px;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1}
.btn-del:hover{color:var(--negative);background:#fef0f0}
.btn-add{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px dashed var(--border);border-radius:5px;background:none;cursor:pointer;font-size:12px;color:var(--text-muted);transition:all .15s;margin-top:5px;font-family:'IBM Plex Sans',sans-serif}
.btn-add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.btn-add.ne{border-color:var(--primary-muted);color:var(--primary-muted);margin-top:8px}
.btn-add.ne:hover{background:rgba(26,48,32,.06)}
.crop-div{background:var(--primary);color:#fff;padding:8px 16px;font-family:'Playfair Display',serif;font-style:italic;font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:14px;border-radius:var(--radius)}

/* ── RIGHT PANEL ── */
.right-panel{background:var(--primary);color:#fff;padding:20px 18px;position:sticky;top:98px;height:calc(100vh - 98px);overflow-y:auto}
.right-panel::-webkit-scrollbar{width:4px}
.right-panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
.r-title{font-family:'Playfair Display',serif;font-style:italic;font-size:15px;color:rgba(255,255,255,.45);margin-bottom:12px}

/* ── RI HERO (protagonista) ── */
.ri-hero{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);
  border-radius:10px;
  padding:16px;
  margin-bottom:14px;
  position:relative;
  overflow:hidden;
}
.ri-hero::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),rgba(200,168,75,.3));
}
.ri-hero-t{
  font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;
  color:rgba(255,255,255,.4);margin-bottom:12px;font-weight:600;
}
.ri-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ri-block{
  text-align:center;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:7px;padding:12px 8px;
}
.ri-block .rl{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.35);margin-bottom:5px;display:block}
.ri-block .rn{font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:600;color:#fff;line-height:1;display:block}
.ri-block .ru{font-size:10px;color:rgba(255,255,255,.3);margin-top:3px;display:block}
.ri-footer{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  padding-top:10px;border-top:1px solid rgba(255,255,255,.08);
}
.ri-footer-item{text-align:center}
.ri-footer-item .rfl{font-size:9.5px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:3px}
.ri-footer-item .rfv{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;display:block}

/* ── IB ── */
.r-ib{background:rgba(200,168,75,.1);border:1px solid rgba(200,168,75,.2);border-radius:8px;padding:11px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.r-ib .il{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4)}
.r-ib .iv{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500;color:var(--accent)}
.r-ib .is{font-size:10.5px;color:rgba(255,255,255,.3);margin-top:2px;font-family:'IBM Plex Mono',monospace}

/* ── MB CARDS ── */
.mb-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mbc{border-radius:8px;padding:11px 12px;text-align:center;border:1px solid rgba(255,255,255,.08)}
.mbc .ml{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);display:block;margin-bottom:5px}
.mbc .mv{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;display:block}
.mbc.pos-c{background:rgba(26,102,48,.28)}.mbc.neg-c{background:rgba(184,48,48,.28)}
.mv.pos{color:#68e085}.mv.neg{color:#ff7c6c}

/* ── BREAKDOWN ── */
.bd{margin-bottom:12px}
.bdt{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.3);margin-bottom:7px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.07)}
.bdr{display:flex;justify-content:space-between;align-items:center;padding:3.5px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.bdr:last-child{border-bottom:none}
.bdr .bl{font-size:11.5px;color:rgba(255,255,255,.55)}.bdr .bv{font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(255,255,255,.75)}
.bdr.sub .bl{font-size:10.5px;color:rgba(255,255,255,.27);padding-left:12px}.bdr.sub .bv{font-size:10.5px;color:rgba(255,255,255,.37)}
.bdr.tot{padding-top:7px;margin-top:3px;border-top:1px solid rgba(255,255,255,.16)}
.bdr.tot .bl{color:#fff;font-weight:600}.bdr.tot .bv{color:#fff;font-weight:600}

/* ── COMBINED ── */
.res-sep{border:none;border-top:1px solid rgba(255,255,255,.1);margin:12px 0}
.r-sub{font-size:13px;font-weight:600;color:rgba(255,255,255,.55);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.comb-box{background:rgba(200,168,75,.1);border:1px solid rgba(200,168,75,.28);border-radius:8px;padding:12px 14px;margin-top:10px}
.comb-box .ct{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.4);margin-bottom:9px}
.comb-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.comb-row label{font-size:12px;color:rgba(255,255,255,.6)}
.comb-v{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600}

/* ── RESUMEN ── */
.res-panel{padding:24px}
.res-panel h2{font-family:'Playfair Display',serif;font-size:22px;color:var(--primary);margin-bottom:20px}
.res-tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.res-tbl th{background:var(--primary);color:#fff;padding:11px 13px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;text-align:right}
.res-tbl th:first-child{text-align:left}
.res-tbl td{padding:11px 13px;border-bottom:1px solid var(--border);font-family:'IBM Plex Mono',monospace;font-size:13px;text-align:right}
.res-tbl td:first-child{font-family:'IBM Plex Sans',sans-serif;font-weight:600;text-align:left}
.res-tbl tr:last-child td{border-bottom:none}
.res-tbl tr:hover td{background:var(--surface2)}
.res-tbl tr.crow td{background:#f0ece0;font-weight:600}
.pv{color:var(--positive);font-weight:600}.nv{color:var(--negative);font-weight:600}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--primary);color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.3);transition:all .3s;border-left:3px solid var(--accent)}
.toast.hide{transform:translateY(10px);opacity:0}

@media(max-width:900px){.pgrid{grid-template-columns:repeat(2,1fr)}.crop-layout,.ts-layout{grid-template-columns:1fr}.right-panel{position:static;height:auto}}

/* ── EXPORT MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:900;display:flex;align-items:center;justify-content:center}
.modal-box{background:#fff;border-radius:10px;padding:28px 32px;width:460px;max-width:95vw;box-shadow:0 8px 40px rgba(0,0,0,.25)}
.modal-box h3{font-family:'Playfair Display',serif;font-size:18px;color:var(--primary);margin-bottom:18px}
.modal-logo-row{display:flex;gap:12px;margin-bottom:18px}
.logo-opt{flex:1;border:2px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;transition:all .2s;text-align:center}
.logo-opt:hover{border-color:var(--accent)}
.logo-opt.selected{border-color:var(--primary);background:var(--surface2)}
.logo-opt img{height:48px;object-fit:contain;display:block;margin:0 auto 6px}
.logo-opt span{font-size:11px;font-weight:600;color:var(--text-muted)}
.modal-field{margin-bottom:14px}
.modal-field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:600;margin-bottom:5px}
.modal-field input{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:5px;font-size:14px;font-family:'IBM Plex Sans',sans-serif}
.modal-field input:focus{outline:none;border-color:var(--accent)}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.btn-export{flex:1;padding:10px;background:var(--primary);color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;transition:background .15s}
.btn-export:hover{background:var(--primary-light)}
.btn-cancel{padding:10px 18px;background:none;border:1px solid var(--border);border-radius:6px;font-size:14px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif}

</style>
</head>
<body>
<div class="header">
  <div class="hbrand">
    <h1>🌾 Margen Bruto</h1>
    <span class="sub">Terra Más · Campaña 26/27</span>
  </div>
  <div class="hactions">
    <button class="btn-h btn-save" onclick="saveData()">💾 Guardar</button>
    <button class="btn-h" onclick="resetCrop()">↺ Restablecer</button>
    <button class="btn-h" onclick="sw('resumen')">📊 Resumen</button>
    <button class="btn-h btn-save" onclick="openExportModal()" style="border-color:#68b4e8;color:#68b4e8">📥 Exportar Excel</button>
  </div>
</div>
<div class="tabs" id="tabs"></div>
<div id="content"></div>

// ═══ STATE ═══
let DATA=JSON.parse(JSON.stringify(ORIGINAL));
let activeKey='ts';
const TABS=[
  {k:'ts',    lbl:'🌾🌱 Trigo + Soja 2ª'},
  {k:'am2',   lbl:'🟢🌽 Arveja + Maíz 2ª'},
  {k:'soja1', lbl:'🌿 Soja 1ª'},
  {k:'maiz',  lbl:'🌽 Maíz'},
  {k:'resumen',lbl:'📊 Resumen'},
];
// Mapa tab → crops individuales para reset
const TAB_KEYS={ts:['trigo','soja2'],am2:['arveja','maiz2'],soja1:['soja1'],maiz:['maiz'],resumen:[]};

function saveData(){
  try{localStorage.setItem('mb_v5',JSON.stringify(DATA));toast('✓ Datos guardados')}
  catch(e){toast('Error al guardar')}
}
function loadData(){
  try{const s=localStorage.getItem('mb_v5');if(s){const p=JSON.parse(s);Object.keys(p).forEach(k=>{if(DATA[k])DATA[k]=p[k]})}}catch(e){}
}
function resetCrop(){
  const ks=TAB_KEYS[activeKey];if(!ks||!ks.length)return;
  const nm=ks.map(k=>DATA[k].nombre).join(' y ');
  if(!confirm('¿Restablecer '+nm+' a los valores originales?'))return;
  ks.forEach(k=>{DATA[k]=JSON.parse(JSON.stringify(ORIGINAL[k]))});
  renderContent();toast('↺ Valores restablecidos');
}
function toast(msg){
  let t=document.querySelector('.toast');if(t)t.remove();
  t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.classList.add('hide');setTimeout(()=>t.remove(),300)},2000);
}

// ═══ CÁLCULO ═══
function calc(k){
  const c=DATA[k];
  const IB=c.precio*c.rendimiento;
  const ins=c.insumos.reduce((s,i)=>s+i.p*i.d,0);
  const lab=c.labores.reduce((s,l)=>s+l.c*l.t,0);
  const com=IB*(c.comision_pct/100);
  const par=c.paritarias_usd_tn*c.rendimiento;
  const flc=c.tc>0?(c.flete_corto/c.tc)*c.rendimiento:0;
  const fll=c.tc>0?(c.flete_largo/c.tc)*c.rendimiento:0;
  const granizo=c.tc>0?(c.granizo_pesos||0)/c.tc:0;
  const cmr=com+par+flc+fll;
  const sa=ins+lab+cmr+granizo,ca=sa+c.alquiler;
  return{IB,ins,lab,cmr,com,par,flc,fll,granizo,sa,ca,
    mbA:IB-ca,mbP:IB-sa,
    riA:c.precio>0?ca/c.precio:0,
    riP:c.precio>0?sa/c.precio:0};
}

// ═══ FORMAT ═══
const f2=n=>n.toFixed(2),f1=n=>n.toFixed(1);
const usd=n=>'U$S '+Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const sgn=n=>n>=0?'+':'−';
const esc=s=>String(s).replace(/"/g,'&quot;');

// ═══ TABS ═══
function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(t=>
    `<div class="tab ${t.k===activeKey?'active':''}" onclick="sw('${t.k}')">${t.lbl}</div>`
  ).join('');
}
function sw(k){activeKey=k;renderTabs();renderContent()}

function htmlIns(k){
  const rows=DATA[k].insumos,etapas=[...new Set(rows.map(r=>r.e))];
  let h=`<div class="tbl-head ins"><span>Producto</span><span style="text-align:right">Precio U$S</span><span style="text-align:right">Dosis</span><span style="text-align:right">Total</span><span></span></div>`;
  etapas.forEach(e=>{
    h+=`<div class="etapa-group"><div class="etapa-label">${e}</div>`;
    rows.forEach((r,i)=>{if(r.e!==e)return;
      h+=`<div class="ins-row">
        <input type="text" value="${esc(r.n)}" onchange="ui('${k}',${i},'n',this.value)">
        <input type="number" value="${r.p}" step="0.01" min="0" style="text-align:right" oninput="ui('${k}',${i},'p',+this.value||0)">
        <input type="number" value="${r.d}" step="0.001" min="0" style="text-align:right" oninput="ui('${k}',${i},'d',+this.value||0)">

        <button class="btn-del" onclick="di('${k}',${i})">×</button>

    });
    h+=`<button class="btn-add" onclick="ai('${k}','${e.replace(/'/g,"\\'")}')">+ Agregar</button></div>`;
  });
  h+=`<button class="btn-add ne" onclick="ne('${k}')">+ Nueva etapa</button>`;
  return h;
}

// ═══ COMBINED TOTAL BOX ═══
function htmlCombTotal(k1,k2,label){
  const r1=calc(k1),r2=calc(k2);
  const cA=r1.mbA+r2.mbA,cP=r1.mbP+r2.mbP;
  return`<div class="comb-box">
    <div class="ct">${label}</div>
    <div class="comb-row"><label>MB Arrendado total</label><span class="comb-v ${cA>=0?'pos':'neg'}">${sgn(cA)} ${usd(cA)}</span></div>
    <div class="comb-row"><label>MB Propio total</label><span class="comb-v ${cP>=0?'pos':'neg'}">${sgn(cP)} ${usd(cP)}</span></div>
  </div>`;
}

// ═══ RESUMEN ═══
function htmlResumen(){
  const ks=['trigo','soja2','soja1','maiz','arveja','maiz2'];
  const rows=ks.map(k=>{const c=DATA[k],r=calc(k);
    return`<tr><td>${c.emoji} ${c.nombre}</td><td>${f2(c.precio)}</td><td>${f1(c.rendimiento)}</td><td>${f2(r.IB)}</td><td>${f2(r.ins)}</td><td>${f2(r.lab)}</td><td>${f2(r.cmr)}</td><td>${f2(c.alquiler)}</td><td>${f2(r.ca)}</td><td class="${r.mbA>=0?'pv':'nv'}">${f2(r.mbA)}</td><td class="${r.mbP>=0?'pv':'nv'}">${f2(r.mbP)}</td><td>${f1(r.riA)}</td><td>${f1(r.riP)}</td></tr>`;
  }).join('');
  function combRow(k1,k2,lbl){
    const r1=calc(k1),r2=calc(k2),c1=DATA[k1],c2=DATA[k2];
    const cA=r1.mbA+r2.mbA,cP=r1.mbP+r2.mbP;
    return`<tr class="crow"><td>${c1.emoji}${c2.emoji} ${lbl}</td><td>—</td><td>—</td><td>${f2(r1.IB+r2.IB)}</td><td>${f2(r1.ins+r2.ins)}</td><td>${f2(r1.lab+r2.lab)}</td><td>${f2(r1.cmr+r2.cmr)}</td><td>${f2(c1.alquiler+c2.alquiler)}</td><td>${f2(r1.ca+r2.ca)}</td><td class="${cA>=0?'pv':'nv'}">${f2(cA)}</td><td class="${cP>=0?'pv':'nv'}">${f2(cP)}</td><td>—</td><td>—</td></tr>`;
  }
  return`<div class="res-panel"><h2>📊 Resumen comparativo — Campaña 26/27</h2>
  <div style="overflow-x:auto"><table class="res-tbl"><thead><tr>
    <th>Cultivo</th><th>Precio U$S/tn</th><th>Rend. tn/Ha</th><th>IB U$S/Ha</th>
    <th>Insumos</th><th>Labores</th><th>Comerc.</th><th>Alquiler</th><th>Costo arr.</th>
    <th>MB Arrendado</th><th>MB Propio</th><th>R.I. arr.</th><th>R.I. prop.</th>
  </tr></thead><tbody>
    ${rows}
    ${combRow('trigo','soja2','Trigo + Soja 2ª')}
    ${combRow('arveja','maiz2','Arveja + Maíz 2ª')}
  </tbody></table></div>
  <p style="margin-top:14px;font-size:11px;color:var(--text-muted)">Valores en U$S/Ha · R.I. = Rendimiento de indiferencia · Filas sombreadas = suma de la rotación anual</p>
  </div>`;
}

// ═══ RENDER CONTENT ═══
function renderContent(){
  const el=document.getElementById('content');
  if(activeKey==='resumen'){el.innerHTML=htmlResumen();return}

  // Vistas combinadas
  if(activeKey==='ts'||activeKey==='am2'){
    const k1=activeKey==='ts'?'trigo':'arveja';
    const k2=activeKey==='ts'?'soja2':'maiz2';
    const r1=calc(k1),r2=calc(k2);
    const label=activeKey==='ts'?'🌾 Trigo':'🟢 Arveja';
    const label2=activeKey==='ts'?'🌱 Soja 2ª':'🌽 Maíz 2ª';
    const rotLabel=activeKey==='ts'?'Total rotación Trigo / Soja 2ª (U$S/Ha)':'Total rotación Arveja / Maíz 2ª (U$S/Ha)';
    el.innerHTML=`<div class="ts-layout">
      <div class="left-panel narrow">
        <div class="crop-div">${label}</div>
        ${htmlParams(k1)}
        <div class="card"><div class="card-header"><span>Insumos</span><span class="card-total" id="it-tot-${k1}">U$S ${f2(r1.ins)}</span></div><div class="card-body tight" id="ib-${k1}">${htmlIns(k1)}</div></div>
        <div class="card"><div class="card-header"><span>Labores</span><span class="card-total" id="lt-tot-${k1}">U$S ${f2(r1.lab)}</span></div><div class="card-body tight" id="lb-${k1}">${htmlLab(k1)}</div></div>
      </div>
      <div class="left-panel narrow" style="border-left:1px solid var(--border)">
        <div class="crop-div">${label2}</div>
        ${htmlParams(k2)}
        <div class="card"><div class="card-header"><span>Insumos</span><span class="card-total" id="it-tot-${k2}">U$S ${f2(r2.ins)}</span></div><div class="card-body tight" id="ib-${k2}">${htmlIns(k2)}</div></div>
        <div class="card"><div class="card-header"><span>Labores</span><span class="card-total" id="lt-tot-${k2}">U$S ${f2(r2.lab)}</span></div><div class="card-body tight" id="lb-${k2}">${htmlLab(k2)}</div></div>
      </div>
      <div class="right-panel" id="rp-${activeKey}">
        <div class="r-title" style="margin-bottom:14px">${activeKey==='ts'?'🌾🌱':'🟢🌽'} Rotación del año</div>
        ${htmlMini(k1)}
        <hr class="res-sep">
        ${htmlMini(k2)}
        ${htmlCombTotal(k1,k2,rotLabel)}
      </div>
    </div>`;
    return;
  }

  // Vista individual
  const k=activeKey,r=calc(k);
  el.innerHTML=`<div class="crop-layout">
    <div class="left-panel">
      ${htmlParams(k)}
      <div class="card"><div class="card-header"><span>Insumos</span><span class="card-total" id="it-tot-${k}">U$S ${f2(r.ins)}</span></div><div class="card-body" id="ib-${k}">${htmlIns(k)}</div></div>
      <div class="card"><div class="card-header"><span>Labores</span><span class="card-total" id="lt-tot-${k}">U$S ${f2(r.lab)}</span></div><div class="card-body" id="lb-${k}">${htmlLab(k)}</div></div>
    </div>
    <div class="right-panel" id="rp-${k}">${htmlRes(k)}</div>
  </div>`;
}

function up(k,f,v){DATA[k][f]=v;rr(k)}

    const el=document.getElementById('rp-'+k);

}

// ═══ EXPORT MODAL ═══
function openExportModal(){
  if(document.getElementById('export-modal')) return;
  const m=document.createElement('div');
  m.id='export-modal';
  m.className='modal-overlay';
  m.innerHTML=`
    <div class="modal-box">
      <h3>📥 Exportar análisis a Excel</h3>
      <div class="modal-logo-row">
        <div class="logo-opt selected" id="opt-tm" onclick="selLogo('tm')">
          <img src="${LOGO_TM}" alt="Terra Más">
          <span>Terra Más</span>
        </div>
        <div class="logo-opt" id="opt-ts" onclick="selLogo('ts')">
          <img src="${LOGO_TS}" alt="Terra Salto">
          <span>Terra Salto</span>
        </div>
      </div>
      <div class="modal-field"><label>Vendedor / Asesor</label><input id="exp-vendedor" placeholder="Tu nombre" value=""></div>
      <div class="modal-field"><label>Productor / Campo</label><input id="exp-productor" placeholder="Nombre del cliente o campo" value=""></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeExportModal()">Cancelar</button>
        <button class="btn-export" onclick="doExport()">📥 Descargar Excel</button>
      </div>
    </div>`;
  document.body.appendChild(m);
}
let selectedLogo='tm';
function selLogo(l){
  selectedLogo=l;
  document.getElementById('opt-tm').classList.toggle('selected',l==='tm');
  document.getElementById('opt-ts').classList.toggle('selected',l==='ts');
}
function closeExportModal(){
  const m=document.getElementById('export-modal');if(m)m.remove();
}

// ═══ EXCEL EXPORT ═══
function doExport(){
  const vendedor=document.getElementById('exp-vendedor').value||'—';
  const productor=document.getElementById('exp-productor').value||'—';
  const empresa=selectedLogo==='tm'?'Terra Más':'Terra Salto';
  const fecha=new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
  const wb=XLSX.utils.book_new();

  // ── Colores ──
  const HDR={font:{bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'1A3020'}},alignment:{horizontal:'center'}};
  const HDR2={font:{bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'274830'}},alignment:{horizontal:'left'}};
  const GOLD={font:{bold:true,color:{rgb:'C8A84B'}},fill:{fgColor:{rgb:'1A3020'}},alignment:{horizontal:'center'}};
  const POS={font:{bold:true,color:{rgb:'1A6630'}},alignment:{horizontal:'right'}};
  const NEG={font:{bold:true,color:{rgb:'B83030'}},alignment:{horizontal:'right'}};
  const NUM={alignment:{horizontal:'right'}};
  const BOLD={font:{bold:true}};
  const SUB={font:{italic:true,color:{rgb:'888888'}},alignment:{horizontal:'right'}};
  const CENTER={alignment:{horizontal:'center'}};

  function mbStyle(v){return v>=0?POS:NEG;}
  function n2(v){return Math.round(v*100)/100;}

  // ── HOJA RESUMEN ──
  const allKeys=['trigo','soja2','soja1','maiz','arveja','maiz2'];
  const aoa=[
    // Encabezado empresa
    [empresa,'','Análisis de Margen Bruto','','Campaña 26/27',''],
    ['Vendedor:',vendedor,'Productor / Campo:',productor,'Fecha:',fecha],
    [],
    ['Cultivo','Precio U$S/tn','Rend. tn/Ha','IB U$S/Ha','Insumos','Labores','Comerc.','Granizo','Alquiler','Costo arr.','MB Arrendado','MB Propio','R.I. arr.','R.I. prop.'],
  ];
  const styles_res=[];
  // row 0: empresa header
  styles_res.push([HDR,null,HDR,null,HDR,null]);
  styles_res.push([BOLD,null,BOLD,null,BOLD,null]);
  styles_res.push([]);
  styles_res.push(Array(14).fill(HDR2));

  allKeys.forEach(k=>{
    const c=DATA[k],r=calc(k);
    aoa.push([
      c.emoji+' '+c.nombre,
      n2(c.precio),n2(c.rendimiento),n2(r.IB),
      n2(r.ins),n2(r.lab),n2(r.cmr),n2(r.granizo),
      n2(c.alquiler),n2(r.ca),
      n2(r.mbA),n2(r.mbP),
      n2(r.riA),n2(r.riP)
    ]);
    styles_res.push([null,...Array(9).fill(NUM),mbStyle(r.mbA),mbStyle(r.mbP),NUM,NUM]);
  });

  // Rotaciones
  function addRotRow(k1,k2,lbl){
    const r1=calc(k1),r2=calc(k2),c1=DATA[k1],c2=DATA[k2];
    const cA=r1.mbA+r2.mbA,cP=r1.mbP+r2.mbP;
    aoa.push([
      lbl,'—','—',n2(r1.IB+r2.IB),
      n2(r1.ins+r2.ins),n2(r1.lab+r2.lab),n2(r1.cmr+r2.cmr),n2(r1.granizo+r2.granizo),
      n2(c1.alquiler+c2.alquiler),n2(r1.ca+r2.ca),
      n2(cA),n2(cP),'—','—'
    ]);
    styles_res.push([BOLD,CENTER,CENTER,...Array(8).fill(NUM),mbStyle(cA),mbStyle(cP),CENTER,CENTER]);
  }
  aoa.push([]);styles_res.push([]);
  addRotRow('trigo','soja2','🌾🌱 Trigo + Soja 2ª');
  addRotRow('arveja','maiz2','🟢🌽 Arveja + Maíz 2ª');

  const wsRes=XLSX.utils.aoa_to_sheet(aoa);
  // Merge encabezado
  wsRes['!merges']=[
    {s:{r:0,c:0},e:{r:0,c:1}},
    {s:{r:0,c:2},e:{r:0,c:3}},
    {s:{r:0,c:4},e:{r:0,c:5}},
  ];
  wsRes['!cols']=[{wch:22},{wch:13},{wch:12},{wch:12},{wch:11},{wch:10},{wch:10},{wch:10},{wch:10},{wch:11},{wch:13},{wch:13},{wch:10},{wch:10}];
  // Apply styles
  styles_res.forEach((row,ri)=>{
    if(!row||!row.length)return;
    row.forEach((st,ci)=>{
      if(!st)return;
      const addr=XLSX.utils.encode_cell({r:ri,c:ci});
      if(wsRes[addr])wsRes[addr].s=st;
    });
  });
  XLSX.utils.book_append_sheet(wb,wsRes,'Resumen');

  // ── HOJAS POR CULTIVO ──
  allKeys.forEach(k=>{
    const c=DATA[k],r=calc(k);
    const rows=[
      [empresa,'','Margen Bruto — '+c.nombre,'','',''],
      ['Vendedor:',vendedor,'Productor / Campo:',productor,'Fecha:',fecha],
      [],
      // Params
      ['PARÁMETROS','','','','',''],
      ['Precio grano (U$S/tn)',n2(c.precio),'Rendimiento esp. (tn/Ha)',n2(c.rendimiento),'TC ($/U$S)',n2(c.tc)],
      ['Alquiler (U$S/Ha)',n2(c.alquiler),'Comisión (%)',n2(c.comision_pct),'Paritarias (U$S/tn)',n2(c.paritarias_usd_tn)],
      ['Flete corto ($/tn)',n2(c.flete_corto),'Flete largo ($/tn)',n2(c.flete_largo),'Granizo ($/Ha)',n2(c.granizo_pesos||0)],
      [],
      // Insumos
      ['INSUMOS','Precio U$S','Dosis','Total U$S/Ha','',''],
    ];
    const etapas=[...new Set(c.insumos.map(i=>i.e))];
    etapas.forEach(e=>{
      rows.push([e,'','','','','']);
      c.insumos.filter(i=>i.e===e).forEach(i=>{
        rows.push(['  '+i.n,n2(i.p),n2(i.d),n2(i.p*i.d),'','']);
      });
    });
    rows.push(['TOTAL INSUMOS','','',n2(r.ins),'','']);
    rows.push([]);
    // Labores
    rows.push(['LABORES','Cantidad','U$S/Ha','Total U$S/Ha','','']);
    c.labores.forEach(l=>{rows.push([l.n,l.c,n2(l.t),n2(l.c*l.t),'','']);});
    rows.push(['TOTAL LABORES','','',n2(r.lab),'','']);
    rows.push([]);
    // Comercialización
    rows.push(['COMERCIALIZACIÓN','','','U$S/Ha','','']);
    rows.push(['Comisión '+f1(c.comision_pct)+'%','','',n2(r.com),'','']);
    rows.push(['Paritarias','','',n2(r.par),'','']);
    rows.push(['Flete corto','','',n2(r.flc),'','']);
    rows.push(['Flete largo','','',n2(r.fll),'','']);
    rows.push(['Seguro granizo','','',n2(r.granizo),'','']);
    rows.push(['TOTAL COMERCIALIZACIÓN','','',n2(r.cmr),'','']);
    rows.push([]);
    // Resumen
    rows.push(['RESUMEN DE RESULTADOS','','','','','']);
    rows.push(['Ingreso Bruto (U$S/Ha)','','',n2(r.IB),'','']);
    rows.push(['Costo total s/alquiler','','',n2(r.sa),'','']);
    rows.push(['Alquiler','','',n2(c.alquiler),'','']);
    rows.push(['Costo total c/alquiler','','',n2(r.ca),'','']);
    rows.push([]);
    rows.push(['','Campo arrendado','Campo propio','','','']);
    rows.push(['Margen Bruto (U$S/Ha)',n2(r.mbA),n2(r.mbP),'','','']);
    rows.push(['R. de Indiferencia (tn/Ha)',n2(r.riA),n2(r.riP),'','','']);
    rows.push(['Rendimiento esperado (tn/Ha)',n2(c.rendimiento),'','','','']);

    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:28},{wch:13},{wch:12},{wch:13},{wch:8},{wch:8}];

    // Styles por sección
    const hdrRows=[0,1,3,8];
    // Row 0 empresa
    ['A1','B1','C1','D1','E1','F1'].forEach(a=>{if(ws[a])ws[a].s=HDR;});
    // Headers de sección: buscar por contenido
    rows.forEach((row,ri)=>{
      const v=row[0];
      if(['PARÁMETROS','INSUMOS','LABORES','COMERCIALIZACIÓN','RESUMEN DE RESULTADOS'].includes(v)){
        for(let ci=0;ci<6;ci++){const a=XLSX.utils.encode_cell({r:ri,c:ci});if(ws[a])ws[a].s=HDR2;}
      }
      if(['TOTAL INSUMOS','TOTAL LABORES','TOTAL COMERCIALIZACIÓN'].includes(v)){
        const a0=XLSX.utils.encode_cell({r:ri,c:0});const a3=XLSX.utils.encode_cell({r:ri,c:3});
        if(ws[a0])ws[a0].s=BOLD;if(ws[a3])ws[a3].s=BOLD;
      }
      if(v==='Margen Bruto (U$S/Ha)'){
        const a1=XLSX.utils.encode_cell({r:ri,c:1});const a2=XLSX.utils.encode_cell({r:ri,c:2});
        if(ws[a1])ws[a1].s=mbStyle(r.mbA);if(ws[a2])ws[a2].s=mbStyle(r.mbP);
      }
    });

    const sheetName=c.nombre.replace('ª','a').substring(0,31);
    XLSX.utils.book_append_sheet(wb,ws,sheetName);
  });

  const fname='MargenBruto_'+(productor||empresa).replace(/[^a-zA-Z0-9]/g,'_')+'_'+fecha.replace(/\//g,'-')+'.xlsx';
  XLSX.writeFile(wb,fname);
  closeExportModal();
}

// ═══ INIT ═══
loadData();renderTabs();renderContent();
</script>
